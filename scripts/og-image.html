<!doctype html>
<!--
  og-image.html — source for public/og-image.png, the 1200x630 link-preview
  card used by og:image / twitter:image. Edit the copy here, then regenerate:

    npx playwright screenshot --viewport-size="1200,630" --wait-for-timeout=1500 \
      "file://$PWD/scripts/og-image.html" public/og-image.png
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400&family=JetBrains+Mono:wght@400;500&display=block"
      rel="stylesheet"
    />
    <style>
      html, body { margin: 0; }
      body {
        position: relative; width: 1200px; height: 630px; overflow: hidden;
        background: #0a0a0a; color: #f2f1ec;
        font-family: 'Inter Tight', Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .glow {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse at 88% -10%, rgba(242, 241, 236, 0.09), transparent 55%);
      }
      .scanlines {
        position: absolute; inset: 0;
        background: repeating-linear-gradient(0deg, transparent 0 2px, rgba(255, 255, 255, 0.014) 2px 3px);
      }
      .frame {
        position: absolute; inset: 64px 76px 56px;
        display: flex; flex-direction: column; justify-content: space-between;
      }
      .top { display: flex; justify-content: space-between; align-items: center; }
      .eyebrow {
        display: flex; align-items: center; gap: 14px;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 17px; letter-spacing: 0.22em; text-transform: uppercase;
        color: rgba(242, 241, 236, 0.58);
      }
      .dot { width: 10px; height: 10px; border-radius: 5px; background: #4ade80; box-shadow: 0 0 12px #4ade80; }
      .mark { width: 56px; height: 56px; }
      h1 {
        margin: 0; font-weight: 400; font-size: 104px;
        letter-spacing: -0.035em; line-height: 1;
      }
      .lede {
        margin-top: 28px; max-width: 920px;
        font-weight: 300; font-size: 42px; line-height: 1.18; letter-spacing: -0.02em;
        color: rgba(242, 241, 236, 0.64);
      }
      .foot {
        display: flex; justify-content: space-between; align-items: baseline;
        padding-top: 26px; border-top: 1px solid rgba(242, 241, 236, 0.14);
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 17px; letter-spacing: 0.18em; color: rgba(242, 241, 236, 0.58);
      }
      .foot .url { letter-spacing: 0.06em; color: #f2f1ec; }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="scanlines"></div>
    <div class="frame">
      <div class="top">
        <div class="eyebrow"><span class="dot"></span>Software Engineer (Full-Stack) · Open to opportunities</div>
        <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="14" fill="#f2f1ec" />
          <path d="M18 46V18h14.5c8.4 0 13.5 4.3 13.5 11.3 0 4.8-2.5 8.3-6.8 10L47 46h-8.1l-6.7-5.9h-6.9V46H18Zm7.3-12.1h6.8c4.3 0 6.6-1.4 6.6-4.4 0-3.1-2.3-4.5-6.6-4.5h-6.8v8.9Z" fill="#0a0a0a" />
        </svg>
      </div>
      <div>
        <h1>Richard Zhang</h1>
        <div class="lede">I build reliable backend and full-stack systems — queues, APIs, data workflows, and the interfaces around them.</div>
      </div>
      <div class="foot">
        <span>UC IRVINE · B.S. INFORMATICS</span>
        <span class="url">asdfghjklzxc123.github.io/portfolio</span>
      </div>
    </div>
  </body>
</html>
