<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Richard Zhang — Full-Stack Software Engineer</title>
    <meta name="description" content="Richard Zhang is a UC Irvine Informatics graduate building reliable backend and full-stack systems, from job processing and APIs to operational interfaces." />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark light" />
    <!-- Link previews need absolute URLs. scripts/prerender-routes.mjs copies
         this file per route and swaps in each page's title, description and
         URL, using og:url below as the site root. -->
    <link rel="canonical" href="https://asdfghjklzxc123.github.io/portfolio/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Richard Zhang" />
    <meta property="og:url" content="https://asdfghjklzxc123.github.io/portfolio/" />
    <meta property="og:title" content="Richard Zhang — Full-Stack Software Engineer" />
    <meta property="og:description" content="Selected backend and full-stack engineering work focused on reliability, data workflows, and usable operational software." />
    <meta property="og:image" content="https://asdfghjklzxc123.github.io/portfolio/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Richard Zhang, full-stack software engineer: I build reliable backend and full-stack systems." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Richard Zhang — Full-Stack Software Engineer" />
    <meta name="twitter:description" content="Selected backend and full-stack engineering work focused on reliability, data workflows, and usable operational software." />
    <meta name="twitter:image" content="https://asdfghjklzxc123.github.io/portfolio/og-image.png" />
    <!-- Root-absolute on purpose: Vite rewrites it to "/portfolio/favicon.svg"
         at build time. A relative "./favicon.svg" resolved against deep links
         such as /portfolio/project/<slug> and 404'd there. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply a stored light/dark choice before first paint, so a returning
      // visitor whose choice differs from the OS setting doesn't see a flash.
      // Same key as src/lib/use-theme.js.
      try {
        var storedTheme = localStorage.getItem('portfolio-theme');
        if (storedTheme === 'dark' || storedTheme === 'light') {
          document.documentElement.setAttribute('data-theme', storedTheme);
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=Fraunces:wght@300;400;500&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
